
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful | AgriGuide AI</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f7ef;
            color: #203b2b;
        }
        .success-card {
            width: 100%;
            max-width: 520px;
            padding: 42px 30px;
            text-align: center;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(30, 70, 40, 0.12);
        }
        .success-icon {
            width: 76px;
            height: 76px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e1f4df;
            color: #287442;
            font-size: 42px;
        }
        h1 { margin: 0 0 14px; font-size: 28px; }
        p { color: #637368; line-height: 1.7; }
        .action-link {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            border-radius: 12px;
            background: #246b43;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .action-link:hover { background: #194f31; }
        .brand {
            margin-bottom: 22px;
            color: #246b43;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <main class="success-card">
        <div class="brand">AgriGuide AI</div>
        <div class="success-icon">&#10003;</div>
        <h1>Registration Successful!</h1>
        <p>Your farmer account has been created successfully.</p>
        <p>Sign in to explore crop recommendations and farming guidance.</p>
        <a class="action-link" href="{{ url_for('login') }}">
            Continue to Login
        </a>
    </main>
</body>
</html>
