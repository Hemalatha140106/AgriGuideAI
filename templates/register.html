<!DOCTYPE html>
<html>
<head>
    <title>AgriGuide AI - Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef7e8;
        }

        nav {
            background-color: #2e7d32;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-weight: bold;
        }

        .container {
            width: 550px;
            margin: 70px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #cccccc;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
        }

        .login-link a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav>
        <h2>AgriGuide AI</h2>

        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>
    </nav>


    <div class="container">

        <h1>Farmer Registration</h1>

        <p class="subtitle">
            Create your AgriGuide AI farmer account
        </p>


        <form action="/register" method="POST">

            <label>Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <label>Location</label>
            <input
                type="text"
                name="location"
                placeholder="Enter your village/city"
                required
            >


            <button type="submit">
                Create Farmer Account
            </button>

        </form>


        <div class="login-link">
            Already have an account?
            <a href="/login">Login here</a>
        </div>

    </div>

</body>
</html>
