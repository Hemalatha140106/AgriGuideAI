<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Recommendation - AgriGuide AI</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f8e8;
        }

        .navbar {
            background-color: #2e7d32;
            color: white;
            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        .container {
            width: 600px;
            margin: 50px auto;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #cccccc;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            text-align: center;
            background-color: #e8f5e9;
            border-radius: 10px;
        }

        .result h2 {
            color: #2e7d32;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


    <div class="navbar">

        <div class="logo">
            AgriGuide AI
        </div>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>


    <div class="container">

        <h1>
            AI Crop Recommendation
        </h1>

        <p class="description">
            Enter soil and weather conditions to get a crop recommendation.
        </p>


        <form method="POST">


            <label>
                Nitrogen (N)
            </label>

            <input
                type="number"
                name="nitrogen"
                step="any"
                required
            >


            <label>
                Phosphorus (P)
            </label>

            <input
                type="number"
                name="phosphorus"
                step="any"
                required
            >


            <label>
                Potassium (K)
            </label>

            <input
                type="number"
                name="potassium"
                step="any"
                required
            >


            <label>
                Temperature (°C)
            </label>

            <input
                type="number"
                name="temperature"
                step="any"
                required
            >


            <label>
                Humidity (%)
            </label>

            <input
                type="number"
                name="humidity"
                step="any"
                required
            >


            <label>
                pH
            </label>

            <input
                type="number"
                name="ph"
                step="any"
                required
            >


            <label>
                Rainfall (mm)
            </label>

            <input
                type="number"
                name="rainfall"
                step="any"
                required
            >


            <button type="submit">
                Get Crop Recommendation
            </button>

        </form>


        {% if recommendation %}

        <div class="result">

            <h2>
                Recommended Crop
            </h2>

            <h2>
                {{ recommendation }}
            </h2>

            <p>
                This recommendation is based on the entered
                soil and weather conditions.
            </p>

        </div>

        {% endif %}


        <a href="{{ url_for('home') }}" class="back">
            ← Back to Home
        </a>

    </div>


</body>

</html>
