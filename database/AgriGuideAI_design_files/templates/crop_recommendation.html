<!DOCTYPE html>
<html>
<head>
    <title>Crop Recommendation - AgriGuideAI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef8e9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #236b2d;
        }

        .subtitle {
            text-align: center;
            font-size: 18px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-top: 18px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 30px;
            background-color: #2d8435;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #236b2d;
        }

        .result {
            margin-top: 35px;
            padding: 30px;
            background-color: #e5f5e7;
            border-radius: 15px;
            text-align: center;
        }

        .result h2 {
            color: #23752e;
            font-size: 30px;
        }

        .crop-name {
            color: #166b24;
            font-size: 34px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #23752e;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Crop Recommendation</h1>

    <p class="subtitle">
        Enter your soil and weather details to get an AI-based crop recommendation.
    </p>

    <form method="POST" action="/crop-recommendation">

        <label>Nitrogen (N)</label>
        <input type="number" name="nitrogen" step="any" required>

        <label>Phosphorus (P)</label>
        <input type="number" name="phosphorus" step="any" required>

        <label>Potassium (K)</label>
        <input type="number" name="potassium" step="any" required>

        <label>Temperature (°C)</label>
        <input type="number" name="temperature" step="any" required>

        <label>Humidity (%)</label>
        <input type="number" name="humidity" step="any" required>

        <label>pH</label>
        <input type="number" name="ph" step="any" required>

        <label>Rainfall (mm)</label>
        <input type="number" name="rainfall" step="any" required>

        <button type="submit">
            Get Crop Recommendation
        </button>

    </form>


    {% if crop %}

    <div class="result">

        <h2>Recommended Crop</h2>

        <div class="crop-name">
            {{ crop }}
        </div>

        <p>
            This recommendation is based on the entered
            soil and weather conditions.
        </p>

    </div>

    {% endif %}


    <a class="back" href="/home">
        ← Back to Home
    </a>

</div>

</body>
</html>
